<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokédex</title>
</head>
<body>
  <h1>Mira este Pokémon</h1>
  <p>Abre este Pokémon en la app Pokédex.</p>

  <button id="openApp">
    Abrir en la app
  </button>

  <script>
    const params = new URLSearchParams(window.location.search);
    const pokemonId = params.get('pokemon') || '1';

    document.getElementById('openApp').addEventListener('click', () => {
      window.location.href = `tareamobile2://pokemon/${pokemonId}`;
    });
  </script>
</body>
</html>
