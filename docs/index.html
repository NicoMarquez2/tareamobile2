<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokédex</title>
  </head>
  <body>
    <h1>Mira este Pokémon</h1>

  <div id="card" class="card">
    <img id="pokemonImage" />
    <h1 id="pokemonName">Cargando...</h1>
    <p id="pokemonNumber"></p>
    <div id="pokemonTypes"></div>

    <button id="openApp">Abrir en la app</button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const pokemonId = params.get('pokemon') || '1';

    const typeColors = {
      normal: '#A8A77A',
      fire: '#EE8130',
      water: '#6390F0',
      electric: '#F7D02C',
      grass: '#7AC74C',
      ice: '#96D9D6',
      fighting: '#C22E28',
      poison: '#A33EA1',
      ground: '#E2BF65',
      flying: '#A98FF3',
      psychic: '#F95587',
      bug: '#A6B91A',
      rock: '#B6A136',
      ghost: '#735797',
      dragon: '#6F35FC',
      dark: '#705746',
      steel: '#B7B7CE',
      fairy: '#D685AD',
    };

    async function loadPokemon() {
      const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${pokemonId}`);
      const pokemon = await response.json();

      document.title = `Pokédex - ${pokemon.name}`;
      document.getElementById('pokemonName').textContent = pokemon.name;
      document.getElementById('pokemonNumber').textContent = `#${pokemon.id}`;
      document.getElementById('pokemonImage').src =
      pokemon.sprites.other['official-artwork'].front_default;

      const primaryType = pokemon.types[0].type.name;
      document.getElementById('card').style.backgroundColor = typeColors[primaryType] || '#fff';

      document.getElementsByTagName('body')[0].style.backgroundColor = typeColors[primaryType] + '60' || '#f0f0f0';

      document.getElementById('pokemonTypes').innerHTML = pokemon.types
        .map(item => `<span class="type" style="background-color: ${typeColors[item.type.name] || '#ccc'}">${item.type.name}</span>`)
        .join('');
      }

      document.getElementById('openApp').addEventListener('click', () => {
        window.location.href = `tareamobile2://pokemon/${pokemonId}`;
      });

      loadPokemon();
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f0f0f0;
    }

    .card {
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      padding: 20px;
      text-align: center;
      width: 300px;
      color: white;
    }

    .card img {
      width: 150px;
      height: 150px;
    }

    .type {
      display: inline-block;
      background-color: #eee;
      border-radius: 5px;
      padding: 5px 10px;
      margin: 5px;
    }

    #pokemonTypes {
      margin-top: 10px;
      background-color: #00000030;
      width: 100%;
      border-radius: 16px;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #00000030;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

  </style>
</body>
</html>
